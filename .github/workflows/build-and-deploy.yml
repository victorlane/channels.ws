name: Build and Deploy to GCR

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REPOSITORY: "europe-west4-docker.pkg.dev/calm-pagoda-465816-m0/channels-ws"
  SERVICE: "server"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}

    - name: Configure Docker to use gcloud
      run: |
        gcloud auth configure-docker europe-west4-docker.pkg.dev

    - name: Get short SHA
      id: sha
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        push: true
        tags: |
          ${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ steps.sha.outputs.sha_short }}
          ${{ env.REPOSITORY }}/${{ env.SERVICE }}:latest
    # - name: Deploy to Cloud Run (optional)
    #   run: |
    #     gcloud run deploy $SERVICE \
    #       --image ${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ steps.sha.outputs.sha_short }} \
    #       --platform managed \
